services:
  # Redis for rate limiting
  redis:
    image: redis:7-alpine
    container_name: production-rag-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - rag_network

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: production-rag-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - rag_network

  # Production RAG API
  rag-api:
    build: .
    container_name: production-rag-api
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot reload
      - ./app:/app/app
      - ./frontend:/app/frontend:ro
      - ./logs:/app/logs
    environment:
      # Application settings
      - APP_ENVIRONMENT=${APP_ENVIRONMENT:-development}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_API_PREFIX=/api

      # LLM settings
      - LLM_OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_COHERE_API_KEY=${COHERE_API_KEY}
      - LLM_EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-large}
      - LLM_LLM_MODEL=${LLM_MODEL:-gpt-4-turbo-preview}

      # Vector DB settings
      - VECTOR_QDRANT_HOST=qdrant
      - VECTOR_QDRANT_PORT=6333
      - VECTOR_QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-rag_collection}

      # RAG settings
      - RAG_CHUNK_SIZE=${CHUNK_SIZE:-512}
      - RAG_CHUNK_OVERLAP=${CHUNK_OVERLAP:-50}
      - RAG_TOP_K_RETRIEVAL=${TOP_K_RETRIEVAL:-50}
      - RAG_TOP_K_RERANK=${TOP_K_RERANK:-15}
      - RAG_MAX_QUERIES_GENERATED=${MAX_QUERIES_GENERATED:-5}

      # Rate limiting settings
      - RATE_LIMIT_RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_REDIS_ENABLED=${REDIS_ENABLED:-true}
      - RATE_LIMIT_REDIS_HOST=redis
      - RATE_LIMIT_REDIS_PORT=6379
      - RATE_LIMIT_RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}

      # Observability settings
      - OBS_LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-false}
      - OBS_LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - OBS_LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - OBS_LOG_LEVEL=${LOG_LEVEL:-INFO}
      - OBS_LOG_FORMAT=${LOG_FORMAT:-console}  # Use console for beautiful colored logs

    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rag_network

volumes:
  redis_data:
    driver: local
  qdrant_storage:
    driver: local

networks:
  rag_network:
    driver: bridge
