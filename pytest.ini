[pytest]
# ==============================================================================
# Pytest Configuration
# ==============================================================================
# Note: Main configuration is in pyproject.toml
# This file provides additional settings and can override pyproject.toml

minversion = 8.0
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Command line options
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=70

# Test markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may use external services)
    e2e: End-to-end tests (full application flow)
    slow: Slow running tests (skip with -m 'not slow')
    redis: Tests requiring Redis
    qdrant: Tests requiring Qdrant
    llm: Tests requiring LLM APIs (expensive)

# Asyncio configuration
asyncio_mode = auto

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options (also in pyproject.toml)
[coverage:run]
source = app
omit =
    */tests/*
    */__pycache__/*
    */venv/*
    */.venv/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = htmlcov
