[project]
name = "production-rag"
version = "0.1.0"
description = "Production-grade RAG framework with FastAPI and Pinecone"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "qdrant-client",
    "openai",
    "cohere",
    "unstructured",
    "python-multipart",
    "numpy",
    "tiktoken",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
